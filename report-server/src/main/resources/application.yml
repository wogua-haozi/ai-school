server:
  port: 8080

spring:
  application:
    name: report-server
  datasource:
    url: jdbc:mysql://localhost:3306/ai_school?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: aischool123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 家长端万人级浏览（每请求 2-4 条索引查询）+ 教师/领导端聚合共享池；默认 10 峰值不够
      maximum-pool-size: 20
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 20s  # 须大于 BLPOP 阻塞时长(5s)，否则空队列时客户端超时先于服务端返回
  flyway:
    enabled: true
    baseline-on-migrate: true   # 存量库（无 flyway 历史表）自动打基线后应用后续版本
    baseline-version: 1         # 基线=V1（V1 与 deploy/schema.sql 一致，仅用于全新空库从零建表）
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB   # 单文件：荣誉证书/微光单张照片均 10MB（各端点自行校验）
      max-request-size: 95MB   # 批72e 微光九图批量上传：9×10MB，超此总量的请求在进控制器前即被拒
  jackson:
    # 渲染契约要求保留 null（incomeTop5 缺位 value:null 等），不能用 non_null
    default-property-inclusion: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

aischool:
  jwt:
    # HS256 密钥（base64，32 字节以上）；生产环境必须改
    secret: YWlfc2Nob29sX20zX200X2RlZmF1bHRfanZ0X3NlY3JldF9wbGVhc2VfY2hhbmdlX21lXzIwMjY=
    expire-hours: 12
  cors:
    # 前两项=本机 vite 开发；后三项=App WebView 源（Capacitor 安卓默认 https://localhost，iOS 为 capacitor://localhost）
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost,https://localhost,capacitor://localhost
  minio:
    endpoint: http://localhost:9000
    access-key: aischool
    secret-key: aischool123
    bucket: ai-school-reports
  render:
    # 渲染核心（冻结模块）主目录：classpath = target/classes + target/lib/*.jar
    # 相对路径=本机裸跑（工作目录 report-server）；容器内由 compose 的 AISCHOOL_RENDER_RENDERER_HOME 覆盖
    renderer-home: ../report-renderer
    concurrency: 6          # Playwright 渲染进程池大小（4~8）
    timeout-seconds: 180    # 单份渲染超时
    work-dir: ./target/render-work
  asset:
    # 素材库（批35）PDF 渲染覆盖目录：server 与渲染子进程同容器共享；容器重建后启动同步自 MinIO
    override-dir: ./target/asset-overrides
  portrait:
    # 成长画像（批40c 垫图版）本地物化目录：渲染子进程同容器直接读文件；
    # 容器重建后由 MinIO 权威缓存回填（localFile 未命中先查 MinIO 再调 API），无需 compose 挂载
    cache-dir: ./target/portrait-cache
  ai:
    # OpenAI 兼容接口；api-key 留空 → AI 草稿降级为规则模板生成（硬数字仍由规则引擎计算）
    base-url: ""
    api-key: ""
    model: ""
    # 批40c 图像生成（IP 成长画像垫图改图）：与文本 AI 完全独立的第二把 key（OpenAI Images edits 协议）；
    # 留空 = 未启用（画像退 IP 原图占位），key 只经管理端「AI 设置」写入 t_sys_config，绝不入仓库
    img-base-url: ""
    img-api-key: ""
    img-model: ""
    img-timeout-seconds: 180   # 改图慢（实测 25~60s + 偶发限流退避 30s 重试一次），给 3 分钟
    # 任务队列 worker 并发 = 对 LLM 的最大同时在途请求数。
    # DeepSeek 并发上限：flash 2500/账号、pro 500/账号（超限返回 429 不封号，未配置时降级模板）。
    # 16 = flash 的 0.6%，覆盖多位老师同时批量（5 位老师×50 人 ≈ 2 分钟跑完）；
    # 换供应商/模型时按其速率上限经 AISCHOOL_AI_CONCURRENCY 环境变量调整，无需改代码。
    concurrency: 16
    # LLM 单次调用读超时：deepseek 偶发慢响应实测可达 60s+，留 2 分钟余量，
    # 超时则该条降级为模板草稿（任务不失败）；批量慢任务由队列消化，不占前端
    timeout-seconds: 120
    # 提示词外置（留空 = 用内置默认）：调话术改这里或对应环境变量即可，无需改代码
    prompts:
      system-teacher: ""       # 班主任角色系统提示词
      comment-instruction: ""  # 寄语写作要求（数据 JSON 仍由代码拼接在后面）
      summary-instruction: ""  # 成长总结写作要求（同上）
  retention:
    # 定时清理（每日 03:17）：AI 任务与审计日志均留 365 天（算法备案口径：日志留存不少于 6 个月，取一年），到量自动删（可按需调整）
    task-days: 365
    audit-days: 365

logging:
  level:
    com.aischool.server: info

springdoc:
  paths-to-match: /api/**   # 只暴露业务接口；公网生产建议整体关闭（SPRINGDOC_API_DOCS_ENABLED=false）
  swagger-ui:
    path: /swagger-ui.html
