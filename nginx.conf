# 前端容器：静态资源 + /api 反代到后端容器（替代 vite dev proxy）
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # 上传上限：批72e 微光九图批量上传 9×10MB=90MB（APK 8MB/证书 10MB 均远在其内）
    client_max_body_size 95m;

    location /api/ {
        proxy_pass http://report-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 真实客户端 IP 透传（登录审计取证用；server 端 clientIp 优先取此头）
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 名册整校导入（4082 生）处理超 2 分钟，与导入脚本 timeout=600 对齐
        proxy_read_timeout 600s;
    }

    # 入口与版本标记禁缓存（App 更新检测依赖 version.json 实时性；重载须拿到新 index.html）
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /version.json { add_header Cache-Control "no-cache"; }

    # 带 hash 的静态资源长缓存（vite 产物内容寻址，可放心缓存一年）
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
